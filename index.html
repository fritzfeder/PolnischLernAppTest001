<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polnisch Lern-App – Verbindungstest</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; background: #f4f6f9; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .status-ok { border-left: 4px solid #2e7d32; background: #e8f5e9; padding: 10px; margin-bottom: 15px; font-size: 0.9rem; }
        input { width: 100%; padding: 10px; margin: 8px 0 15px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-save { background: #1976d2; color: white; }
        .btn-delete { background: #d32f2f; color: white; }
        .btn-ping { width: 100%; background: #2e7d32; color: white; padding: 12px; font-size: 1rem; }
        .btn-ping:disabled { background: #999; cursor: not-allowed; }
        #msg { margin-top: 10px; margin-bottom: 15px; font-weight: bold; font-size: 0.9rem; }
        #pingResult { margin-top: 15px; padding: 15px; border-radius: 6px; display: none; white-space: pre-wrap; line-height: 1.5; }
        .res-ok { background: #e8f5e9; border: 1px solid #2e7d32; color: #1b5e20; }
        .res-err { background: #ffebee; border: 1px solid #c62828; color: #b71c1c; }
    </style>
</head>
<body>
    <div class="card">
        <div class="status-ok">✅ Stufe 1 & 2 aktiv: GitHub Pages & Schlüssel-Tresor bereit.</div>
        <h2>🔐 Schlüssel-Tresor</h2>
        <input type="password" id="apiKey" placeholder="AQ.Ab8...">
        <div class="btn-group">
            <button class="btn-save" onclick="saveKey()">Speichern</button>
            <button class="btn-delete" onclick="deleteKey()">Löschen</button>
        </div>
        <div id="msg"></div>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <h2>📡 Stufe 3: API-Verbindungstest</h2>
        <button id="pingBtn" class="btn-ping" onclick="testConnection()">Verbindung zu Google testen</button>
        <div id="pingResult"></div>
    </div>

    <script>
        const keyInput = document.getElementById('apiKey');
        const msgBox = document.getElementById('msg');
        const pingBtn = document.getElementById('pingBtn');
        const pingResult = document.getElementById('pingResult');

        window.addEventListener('DOMContentLoaded', function() {
            const saved = localStorage.getItem('polnisch_app_key');
            if (saved) {
                keyInput.value = saved;
                showMsg("ℹ️ Gespeicherter Schlüssel geladen.", "#1976d2");
            }
        });

        function saveKey() {
            const val = keyInput.value.trim();
            if ((!val.startsWith("AQ.") && !val.startsWith("AIza")) || val.length < 25) {
                showMsg("❌ Ungültiges Schlüssel-Format.", "#d32f2f");
                return;
            }
            localStorage.setItem('polnisch_app_key', val);
            showMsg("✅ Schlüssel lokal gesichert.", "#2e7d32");
        }

        function deleteKey() {
            localStorage.removeItem('polnisch_app_key');
            keyInput.value = "";
            showMsg("🗑️ Schlüssel gelöscht.", "#555");
        }

        function showMsg(text, color) {
            msgBox.style.color = color;
            msgBox.textContent = text;
        }

        async function testConnection() {
            const apiKey = keyInput.value.trim();
            if (!apiKey) {
                showPing("Bitte zuerst einen API-Schlüssel eingeben.", false);
                return;
            }

            pingBtn.disabled = true;
            pingResult.style.display = "none";

            const models = ["gemini-4-hydrogen", "gemini-3.8-flash"];
            const host = ["https://", "generativelanguage", ".", "googleapis", ".", "com"].join("");
            let lastError = "";

            for (const modelName of models) {
                pingBtn.textContent = "Teste " + modelName + "...";
                const endpoint = host + "/v1beta/models/" + modelName + ":generateContent";

                try {
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-goog-api-key': apiKey
                        },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{ text: "Antworte nur mit einem einzigen polnischen Begrüßungswort und seiner deutschen Übersetzung." }]
                            }]
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        lastError = (data.error && data.error.message) ? data.error.message : ("HTTP " + response.status);
                        continue;
                    }

                    let reply = "";
                    if (data.candidates && data.candidates.length > 0) {
                        const first = data.candidates.at(0);
                        if (first && first.content && first.content.parts && first.content.parts.length > 0) {
                            reply = first.content.parts.at(0).text;
                        }
                    }

                    if (reply) {
                        showPing("✅ Stufe 3 erfolgreich (via " + modelName + ")!\nAntwort: " + reply.trim(), true);
                        pingBtn.disabled = false;
                        pingBtn.textContent = "Verbindung zu Google testen";
                        return;
                    }
                } catch (err) {
                    lastError = err.message;
                }
            }

            showPing("❌ Kein Modell erreichbar. Letzte Meldung:\n" + lastError, false);
            pingBtn.disabled = false;
            pingBtn.textContent = "Verbindung zu Google testen";
        }

        function showPing(text, isSuccess) {
            pingResult.textContent = text;
            pingResult.style.display = "block";
            pingResult.className = isSuccess ? "res-ok" : "res-err";
        }
    </script>
</body>
</html>
