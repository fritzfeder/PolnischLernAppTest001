<script>
    const apiKeyInput = document.getElementById('apiKey');
    const levelSelect = document.getElementById('level');
    const topicInput = document.getElementById('topic');
    const generateBtn = document.getElementById('generateBtn');
    const resultBox = document.getElementById('result-box');

    window.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) apiKeyInput.value = savedKey;
    });

    async function generateText() {
        const apiKey = apiKeyInput.value.trim();
        const level = levelSelect.value;
        const topic = topicInput.value.trim();

        if (!apiKey || !topic) {
            showOutput("Bitte API-Schlüssel und Thema eingeben.", true);
            return;
        }

        localStorage.setItem('gemini_api_key', apiKey);
        generateBtn.disabled = true;
        generateBtn.textContent = "Verbinde mit Google...";
        resultBox.style.display = "none";

        const prompt = `Schreibe einen kurzen Text auf Polnisch über "${topic}". Niveau: ${level}. Länge: 5 bis 8 Sätze. Nur den polnischen Text ausgeben.`;
        
        // Standard-Endpunkt mit text/plain vermeidet oft CORS-Preflight-Probleme im Browser
        const url = `https://googleapis.com{encodeURIComponent(apiKey)}`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error?.message || `HTTP ${response.status}`);
            }

            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) {
                showOutput(text.trim(), false);
            } else {
                showOutput("Leere Antwort von der API erhalten.", true);
            }
        } catch (error) {
            console.error("Detaillierter Fehler:", error);
            showOutput(`Fehler: ${error.message}\n\nBitte drücke F12 -> Konsole für die genaue Ursache.`, true);
        } finally {
            generateBtn.disabled = false;
            generateBtn.textContent = "Polnischen Text erstellen";
        }
    }

    function showOutput(text, isError) {
        resultBox.textContent = text;
        resultBox.style.display = "block";
        resultBox.classList.toggle('error', isError);
    }
</script>
